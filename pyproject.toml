[project]
name = "bux"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "awkward>=2.14.0",
    "flax>=0.12.10",
    "gigatoken>=0.10.0,<0.11",
    "jax>=0.12.0",
    "jaxtyping>=0.3.11",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.8",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "tokenizers>=0.23.3",
    "tomlkit>=0.15.2",
]

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "jupyterlab>=4.6.4",
    "pygls>=2.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tensorboardx>=2.6",
    "ty>=0.0.89",
]
# Exporting to transformers, and checking an export against bux: `bux export`.
export = [
    "safetensors>=0.6",
    "torch>=2.14",
    "transformers>=5.20",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[project.scripts]
bux = "bux.__main__:main"
bux-lsp = "bux.lang.lsp.server:main"

[project.optional-dependencies]
# What `bux export` needs: models export to transformers and are checked in PyTorch.
export = [
    "safetensors>=0.6",
    "torch>=2.14",
    "transformers>=5.20",
]
cuda = [
    "jax[cuda13]>=0.12.0; sys_platform == 'linux'",
    "tokamax[cuda]>=0.0.17; sys_platform == 'linux'",
    # Frost's GDN-2 kernel (GLA, Lightning, gdn2) and the DSA indexer's deterministic
    # top-k, which 1.31.0 lacks
    "nvidia-cudnn-frontend>=1.32.0; sys_platform == 'linux'",
    # FlashAttention-4's CuTe DSL kernels (bux.parallel.fa4), which bux calls through
    # cutlass.jax
    "flash-attn-4>=4.0.0b36; sys_platform == 'linux'",
    # FlashAttention-4's and cudnn-frontend's DSA modules import torch, which their JAX
    # calls never use: its CPU build, beside jax's CUDA
    "torch>=2.14.1; sys_platform == 'linux'",
]
lsp = [
    "pygls>=2.1.1",
]
spark = [
    "pandas>=2.2,<3",
    "pyspark>=4.2",
]
wandb = [
    "wandb>=0.22",
]
tensorboard = [
    "tensorboardx>=2.6",
]

[tool.uv]
default-groups = ["dev", "docs", "export"]  # make ci builds the docs and checks exports
# PyTorch's CPU build on Linux: exports run on the CPU in tests and checks, and the
# cuda extra's kernels only import it.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# Where `use NAME` finds NAME.bux, subfolders included, after the using file's own folder.
[tool.bux]
path = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # tests/conftest.py has every array checked as they run
# flax's nnx.State is generic over typing.Hashable keys, which beartype frowns on
filterwarnings = ["ignore::beartype.roar.BeartypeDecorHintPep585DeprecationWarning"]

[tool.ruff.lint]
# Every function says what it takes and returns; tests/test_typing.py checks that the
# arrays among them say their dtype and shape.
extend-select = ["ANN0", "ANN2"]
# An annotation that names its own class, or a name imported only for type checking,
# stays quoted: jaxtyping evaluates annotations where a function is defined.
ignore = ["UP037"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Triton reads a kernel's annotations as its arguments' kinds: its pointers have none.
"src/bux_vllm/kernels.py" = ["ANN001", "ANN202"]
"src/bux_vllm/streams.py" = ["ANN001", "ANN202"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
extra-paths = ["docs/_ext"]  # the docs' Sphinx extension

# PyTorch declares nn.Module's forward as an attribute, which every module overrides.
[[tool.ty.overrides]]
include = ["src/bux/export/**", "src/bux_vllm/**", "tests/test_export*.py"]
rules = { invalid-mutable-override = "ignore" }

[tool.ty.analysis]
allowed-unresolved-imports = ["vllm.**", "pyspark.**", "tokamax.**", "cudnn.**", "cutlass.**", "triton.**", "jax_triton.**", "flash_attn.**", "transformer_engine.**", "fla.**"]  # the `spark` and `cuda` extras, the image's TE, and vLLM and fla (its plugin, bux_vllm)
