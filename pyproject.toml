[project]
name = "bux"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flax>=0.12.10",
    "jax>=0.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.7",
    "pydantic>=2.14.1",
    "tomlkit>=0.15.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pygls>=2.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
bux = "bux.__main__:main"
bux-lsp = "bux.lang.lsp.server:main"

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.11.2; sys_platform == 'linux'",
    "tokamax[cuda]>=0.0.16; sys_platform == 'linux'",
]
lsp = [
    "pygls>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
