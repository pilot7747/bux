[project]
name = "bux"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "awkward>=2.14.0",
    "flax>=0.12.10",
    "gigatoken>=0.10.0,<0.11",
    "jax>=0.12.0",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.8",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "tomlkit>=0.15.2",
]

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "jupyterlab>=4.6.4",
    "pygls>=2.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[project.scripts]
bux = "bux.__main__:main"
bux-lsp = "bux.lang.lsp.server:main"

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.12.0; sys_platform == 'linux'",
    "tokamax[cuda]>=0.0.17; sys_platform == 'linux'",
]
lsp = [
    "pygls>=2.1.1",
]
spark = [
    "pandas>=2.2,<3",
    "pyspark>=4.2",
]

[tool.uv]
default-groups = ["dev", "docs"]  # make ci builds the docs too
# cudnn-frontend's develop build: Frost's GDN-2 kernel (fused_delta) is not released yet.
override-dependencies = ["nvidia-cudnn-frontend @ https://github.com/NVIDIA/cudnn-frontend/releases/download/v1.32.0.dev76547535/nvidia_cudnn_frontend-1.32.0.dev76547535-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# Where `use NAME` finds NAME.bux, subfolders included, after the using file's own folder.
[tool.bux]
path = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # tests/conftest.py has every array checked as they run
# flax's nnx.State is generic over typing.Hashable keys, which beartype frowns on
filterwarnings = ["ignore::beartype.roar.BeartypeDecorHintPep585DeprecationWarning"]

[tool.ruff.lint]
# Every function says what it takes and returns; tests/test_typing.py checks that the
# arrays among them say their dtype and shape.
extend-select = ["ANN0", "ANN2"]
# An annotation that names its own class, or a name imported only for type checking,
# stays quoted: jaxtyping evaluates annotations where a function is defined.
ignore = ["UP037"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
extra-paths = ["docs/_ext"]  # the docs' Sphinx extension

[tool.ty.analysis]
allowed-unresolved-imports = ["pyspark.**", "tokamax.**", "cudnn.**", "cutlass.**", "triton.**", "jax_triton.**", "transformer_engine.**"]  # the `spark` and `cuda` extras, and the image's TE
