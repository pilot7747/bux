<!doctype html>
<!-- The training and sweep panels on fixtures, without the backend:
       dev/panels.html?run=curriculum&sweep=attention_ablation&theme=dark
     run, sweep: fixtures/run-NAME.json, fixtures/sweep-NAME.json (either alone, or
     both); theme: light | dark; params: a parameter count for tokens per parameter;
     delay: ms before the schedule arrives; pending=1: it never does (the skeleton);
     axis: steps | tokens, the x axis to start with. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bux studio · panels</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../panels.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
    .harness-bar { display: flex; gap: 12px; align-items: center; padding: 8px 16px;
                   border-bottom: 1px solid var(--border); background: var(--surface);
                   font-size: var(--text-sm); color: var(--text-2); }
    .harness-bar select, .harness-bar button { font: inherit; }
    .harness-bar .spacer { flex: 1; }
    .harness-title { font-size: var(--text-xs); color: var(--text-3); padding: 12px 16px 0;
                     text-transform: uppercase; letter-spacing: 0.06em; }
    #log { margin: 0 16px 16px; padding: 8px 10px; font: var(--text-xs) var(--font-mono);
           color: var(--text-2); background: var(--surface-2); border-radius: var(--radius-md);
           white-space: pre-wrap; min-height: 2em; }
  </style>
</head>
<body>
  <div class="harness-bar">
    <label>run <select id="pick-run"></select></label>
    <label>sweep <select id="pick-sweep"></select></label>
    <span class="spacer"></span>
    <button id="theme" type="button">theme</button>
  </div>
  <div class="harness-title" id="title-training">training</div>
  <div id="training"></div>
  <div class="harness-title" id="title-sweep">sweep</div>
  <div id="sweep"></div>
  <pre id="log">ops and targets appear here</pre>
  <script type="module">
    import { renderTraining } from "../training.js";
    import { renderSweep } from "../sweep.js";

    const RUNS = ["smoke", "curriculum", "mixture", "attention_ablation", "attention_search",
      "schedule_sweep", "schedule_sweep-1", "schedule_sweep-2", "schedule_sweep-3",
      "schedule_sweep-4", "schedule_sweep-5", "power", "grid", "width_sweep"];
    const SWEEPS = ["smoke", "attention_ablation", "schedule_sweep", "attention_search",
      "width_sweep", "grid", "search_wide", "mixture", "curriculum"];
    const query = new URLSearchParams(location.search);
    const fixtures = {};

    async function fixture(name) {
      fixtures[name] ??= fetch(`fixtures/${name}.json`).then((r) => (r.ok ? r.json() : null));
      return fixtures[name];
    }

    function log(kind, value) {
      const line = `${kind} ${JSON.stringify(value)}`;
      const box = document.getElementById("log");
      box.textContent = `${line}\n${box.textContent === "ops and targets appear here" ? "" : box.textContent}`;
      console.log(line);
    }

    function later(value) {
      if (query.get("pending")) return new Promise(() => {});
      const ms = Number(query.get("delay") ?? 400);
      return new Promise((resolve) => setTimeout(() => resolve(value), ms));
    }

    async function showRun(name) {
      const el = document.getElementById("training");
      const data = name ? await fixture(`run-${name}`) : null;
      document.getElementById("title-training").hidden = el.hidden = !name;
      if (!name) return;
      renderTraining(el, data?.run ?? null, {
        onEdit: (ops) => log("edit", ops),
        onInspect: (target) => log("inspect", target),
        schedule: () => later(data.schedule),
        params: query.get("params") ? Number(query.get("params")) : undefined,
        axis: query.get("axis") ?? "steps",
        onAxis: (mode) => log("axis", mode),
      });
    }

    async function showSweep(name, picks = null) {
      const el = document.getElementById("sweep");
      document.getElementById("title-sweep").hidden = el.hidden = !name;
      if (!name) return;
      const sweep = structuredClone(await fixture(`sweep-${name}`));
      if (picks) for (const a of sweep.axes) a.pick = picks[a.id] ?? 0;
      renderSweep(el, sweep, {
        onPick: (next) => picked(name, sweep, next),
        onEdit: (ops) => log("edit", ops),
        onInspect: (target) => log("inspect", target),
      });
    }

    // A pick re-renders the sweep, and shows the run it picked where a fixture has it.
    async function picked(name, sweep, picks) {
      log("pick", picks);
      await showSweep(name, picks);
      const k = sweep.runs.findIndex((r) => sweep.axes.every((a) => (r.picks[a.id] ?? 0) === picks[a.id]));
      const run = k > 0 ? `${name}-${k}` : name;
      if (await fixture(`run-${run}`)) select("pick-run", run, showRun);
    }

    function select(id, value, show) {
      const el = document.getElementById(id);
      el.value = value ?? "";
      show(value);
    }

    function options(id, names, current, show) {
      const el = document.getElementById(id);
      for (const n of ["", ...names]) el.append(new Option(n || "—", n));
      el.value = current ?? "";
      el.addEventListener("change", () => {
        query.set(id === "pick-run" ? "run" : "sweep", el.value);
        history.replaceState(null, "", `?${query}`);
        show(el.value);
      });
    }

    function theme(name) {
      document.documentElement.dataset.theme = name;
      query.set("theme", name);
      history.replaceState(null, "", `?${query}`);
    }

    document.documentElement.dataset.theme = query.get("theme") ?? "light";
    document.getElementById("theme").addEventListener("click", () =>
      theme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    const [run, sweep] = [query.get("run"), query.get("sweep")];
    options("pick-run", RUNS, run, showRun);
    options("pick-sweep", SWEEPS, sweep, showSweep);
    Promise.all([showRun(run), showSweep(sweep)]).then(() => setTimeout(act, 100));

    // For screenshots: hover=SELECTOR@fx,fy moves the pointer over the first match, at
    // that fraction of its box; drag=K@fx[,up] drags the K-th LR handle to fx of the
    // plot, and releases it with "up".
    // click=SELECTOR clicks the first match; dblclick=SELECTOR&type=TEXT double-clicks
    // it and types TEXT and Enter into the input that opens.
    function act() {
      if (query.get("hover")) hover(...query.get("hover").split("@"));
      if (query.get("drag")) drag(...query.get("drag").split("@"));
      if (query.get("click")) document.querySelector(query.get("click"))?.click();
      const twice = query.get("dblclick");
      if (twice) document.querySelector(twice)?.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
      if (query.has("type")) type(query.get("type"));
    }

    function type(text) {
      const input = document.activeElement;
      if (input?.tagName !== "INPUT") return log("type", "no input opened");
      input.value = text;
      input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    }

    function at(node, fx, fy) {
      const box = node.getBoundingClientRect();
      return { clientX: box.left + fx * box.width, clientY: box.top + fy * box.height, bubbles: true };
    }

    function hover(selector, where) {
      const [fx, fy] = where.split(",").map(Number);
      const node = document.querySelector(selector);
      node?.dispatchEvent(new PointerEvent("pointermove", at(node, fx, fy)));
    }

    function drag(k, where) {
      const [fx, up] = where.split(",");
      const handle = document.querySelectorAll(".lr-handle")[Number(k)];
      const plot = handle.ownerSVGElement;
      handle.dispatchEvent(new PointerEvent("pointerdown", at(handle, 0.5, 0.5)));
      window.dispatchEvent(new PointerEvent("pointermove", at(plot, Number(fx), 0.5)));
      if (up) window.dispatchEvent(new PointerEvent("pointerup", at(plot, Number(fx), 0.5)));
    }
  </script>
</body>
</html>
